name: ${COMPOSE_PROJECT_NAME:-isso-lab}

services:
  reverse-proxy:
    image: nginx:${NGINX_TAG:-1.27-alpine}
    container_name: isso-nginx
    ports:
      # Loopback-only publication: not reachable from other LAN devices by default.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - training-web
    networks:
      - frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  training-web:
    image: bkimminich/juice-shop:${JUICE_SHOP_TAG:-latest}
    container_name: isso-juice-shop
    expose:
      - "3000"
    networks:
      - frontend
    restart: unless-stopped
    # Intentionally vulnerable training target. No host port is published.

  training-db:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    container_name: isso-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-training}
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  frontend:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
